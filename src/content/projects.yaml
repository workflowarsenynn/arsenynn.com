    - label: Часть II
      labelEn: Part II
      intro: https://t.me/arsenynn/28
      introText:
        - "По мне, существует только пара вещей, способных повлиять на то, чтобы появилось «это»."
        - "Что касается первой вещи, она мелькает у меня в голове каждый раз при заданном мне вопросе: «Зачем?». В наибольшем количестве случаев вопрос задается в контексте довольно низменных жизненных категорий с ожиданием какого-то понятного и рационального для собеседника ответа, на основе его привычных формулировок, ведущих к понятной для него цели."
        - "В то же время существует глобальный вопрос, который звучит точно так же и на который на данном этапе общего развития ни я, ни мой собеседник, ни ты, читатель, не можем дать никакого ответа. В большинстве случаев именно этот контекст вопроса игнорируется и является неуместным. То есть человек интересуется низменным, будучи не в поиске ответа на глобальное, ибо если бы это было так, вопроса бы не существовало в принципе."
        - "Ввиду этого для меня почти всегда не имеет ценности формулировать и давать какой-либо ответ, собеседнику логичнее сначала спросить у своего Бога."
        - "Что касется «этого», то оно всегда является бессмысленным, и это наиважнейший фактор его существования."
        - "Ведь всё, что является нацеленным на смысл и интерес, существует в утилитарных сферах жизни, при этом работает в них отлично, но если мы говорим про «это», то оно всегда будет являться бесполезным."
        - "Проблема в данном мышлении заключается в том, что оно как бы олицетворяет собой чёрную дыру. Бесконечное отражение невероятных по масштабу и глубине вещей, в то же время являющихся бесполезными и никуда не применимыми, которые всегда будут вести ко всему, а на самом деле - ни к чему. Интерес же в том, что это может работать и в обратную сторону. А значит, не все бесполезное является таковым. Важен сам принцип мышления."
        - "Вторая вещь, которая влияет на «это» и работает как противовес первой - это скоротечность и своевременность. По большому счёту - предчувствие смерти. Это работает как некий временный похуизм к собственным принципам и проходит сквозь все налаженные механизмы мышления."
        - "Резкое упрощение действительности и лёгкость в принятии тех или иных решений."
        - "Абсолютно все, чему повезло материализоваться в том или ином виде, существует только благодаря этой вещи."
        - "У меня был стикер типа с цитатой Толстого на зеркале: «Лучше ничего не делать, чем делать ничего»."
        - "Невероятный якорь, чтобы замолчать навсегда, но в этом и заключается его суть."
        - "Периодически я переворачиваю эти слова, ведь мое согласие и противоречие с формулировкой подарило мне две противоречивые вещи, с которыми я научился совладать."
        - "Бессмысленность и скоротечность как система сдержек и противовесов, как две направленные тенденции, работающие друг против друга."
        - "Подводя итог, хочется сказать, что «это» не является преимуществом и не несёт в себе никаких позитивных аспектов, скорее это отклонение от нормы, но именно оно является самым естественным и настоящим, а значит заслуживает исключительного права на существование."
        - "Я нашёл несложный способ проверить и почувствовать: если действительно хочешь что-то сделать - не делай. Правда в том, что тебе просто придётся это сделать независимо от твоих желаний, потому что твой недуг будет этого требовать. В этом заключается настоящее, в этом есть «это»."
        - "II"
      introTextEn:
        - "As I see it, there are only a couple of things capable of causing \"this\" to appear."
        - "As for the first thing, it flashes through my head every time I am asked: \"Why?\". In most cases the question is asked in the context of rather base categories of life, expecting an answer that is clear and rational to the other person, based on their usual formulations and leading to a goal they understand."
        - "At the same time there is a global question that sounds exactly the same, and to which, at this stage of general development, neither I, nor the person I am talking to, nor you, reader, can give any answer. In most cases this context of the question is ignored and is out of place. That is, a person is interested in the base without seeking an answer to the global, for if that were so, the question would not exist at all."
        - "In view of this, it is almost never of value to me to formulate and give any answer. It makes more sense for the other person to ask their God first."
        - "As for \"this\", it is always meaningless, and that is the most important factor of its existence."
        - "After all, everything aimed at meaning and interest exists in the utilitarian spheres of life, and works excellently there, but if we are talking about \"this\", it will always be useless."
        - "The problem with this way of thinking is that it embodies a kind of black hole. An endless reflection of things incredible in scale and depth, yet useless and not applicable to anything, which will always lead to everything and in fact to nothing. The interest, though, is that this can work in the opposite direction too. Which means that not everything useless is so. What matters is the very principle of thinking."
        - "The second thing that affects \"this\" and works as a counterweight to the first is transience and timeliness. By and large, a premonition of death. It works as a kind of temporary not giving a fuck about your own principles and passes through all the established mechanisms of thinking."
        - "A sharp simplification of reality and ease in making decisions."
        - "Absolutely everything that has been lucky enough to materialise in one form or another exists only thanks to this thing."
        - "I had a sticker on the mirror with what passed for a Tolstoy quote: \"Better to do nothing than to do nothing\"."
        - "An incredible anchor for falling silent forever, but that is its essence."
        - "From time to time I turn these words over, because my agreement with and contradiction of the phrase gave me two contradictory things I have learned to cope with."
        - "Meaninglessness and transience as a system of checks and balances, as two directed tendencies working against each other."
        - "To sum up, I would say that \"this\" is not an advantage and carries no positive aspects, it is rather a deviation from the norm, but it is the most natural and real thing, which means it deserves an exclusive right to exist."
        - "I found a simple way to check and feel it: if you really want to do something, don't. The truth is that you will simply have to do it regardless of your wishes, because your affliction will demand it. In this lies the real thing, in this there is \"this\"."
        - "II"
