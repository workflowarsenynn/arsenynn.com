# Схема и проверка: src/content.config.ts. Порядок на странице задаёт order (выбран владельцем 2026-11-01).
# Короткие тексты из advisory (docs/Advisory/), About ждут утверждения владельца.
# Проверка ссылок и открытые вопросы: docs/project_registry.md.
# feed — публичный канал, по последнему посту которого проект поднимается наверх и получает огонёк.
# parts — части @arsenynn: вступление (intro), главы-видео (chapters).
# youtube у главы или работы — ID видео, открывается в плеере на сайте. accent: true — хит, название красным.
# contents — оглавление канала у annFlow: проект, подзаголовок, ссылка на первый пост (из поста «Навигация по проектам канала»).
# en — английский текст для /en/ (обязателен), labelEn — английская подпись ссылки.
# updatedAt — ручная дата (YYYY-MM-DD) для проектов без публичной ленты: bessmyslennost, without-streaming.

- id: arsenynn
  order: 4
  slug: arsenynn
  title: '@arsenynn'
  # Главный проект: название целиком красным.
  accent: true
  tags:
    - concept
    - chapters
    - identity
  shortDescription: "Там, где отсутствие необходимости не исключает неизбежности"
  longDescription:
    - "Не всякое существование нуждается в ответе на вопрос «зачем?»."
    - "Бессмысленность освобождает от необходимости искать цель, но способна замкнуть мысль на самой себе. Скоротечность разрывает этот круг, заставляя действовать вопреки собственным принципам."
    - "@arsenynn — то, что не удалось ни обосновать необходимостью, ни оставить в области возможного."
  status: active
  links:
    - label: Telegram
      url: https://t.me/arsenynn
      type: telegram
      primary: true
  stream: /stream/arsenynn.json
  parts:
    - label: Часть I
      labelEn: Part I
      intro: https://t.me/arsenynn/5
      introText:
        - "Находясь в точке «сейчас», я прекрасно осознаю то, что происходит со мной сегодня, неделю назад, возможно месяц. Я могу попытаться осознать те события, что происходили со мной год назад, но то, что было ранее — большая пропасть. Думаю, что нам свойственно делить жизнь на определенные периоды и отрезки, дабы хоть как-то структурировать происходящее и сохранить, пусть очень поверхностное, но представление о прошедшем."
        - "Дело в том, что я точно знаю, что в абсолютно каждый период жизни мои мысли хоть и совершали бесконечные колебания в поисках сути, но были сформулированы в отношении фундаментальных для меня вещей. Но я совершенно не помню о чем я думал, о чем были повседневные разговоры, что я хотел в тот момент, как я выглядел, и что я был за человек вообще."
        - "Люди так же подвержены менять своё отношение к чему либо, в угоду действующего на них опыта и данности, которая от них не зависит. В виду этого, я могу предположить, что я и мои собеседники далеко вчера и сегодня — это сгусток невидимых изменений в мышлении, которые с ними произошли, соответственно — совершенно разные люди. Множество мертвых личностей, уничтоженных где-то в глубине той, что вынужденно подстроилась под механизмы повседневно происходящего."
        - "Но то, что они воспроизводили в конкретный момент своей жизни, является законченной мыслью, еще не измененной скоротечностью времени."
        - "Я задался целью найти триггер, который дал бы мне возможность оглянуться и наглядно структурировать свою память, исходя из отношения моих личных ассоциаций к твоей многогранной реплике, читатель."
        - "Мой поиск никак не мог закончиться просто на фотографии или конкретики в текстовом виде."
        - "Симбиоз из слова, звука и картинки, хоть и ненамного, но возвращает меня в ту реальность, которая уже является мертвой."
        - "I"
      introTextEn:
        - "Standing at the point of \"now\", I am fully aware of what is happening to me today, a week ago, perhaps a month ago. I can try to make sense of what happened to me a year ago, but what came before that is a great chasm. I think it is in our nature to divide life into periods and stretches, so as to give some structure to what happens and preserve an idea of the past, however superficial."
        - "The thing is, I know for certain that in absolutely every period of my life my thoughts, for all their endless wavering in search of the essence, were formulated around things fundamental to me. But I have no memory at all of what I was thinking, what everyday conversations were about, what I wanted at that moment, what I looked like, or what kind of person I even was."
        - "People are also prone to changing their attitude to things, yielding to the experience acting on them and to a given that does not depend on them. In view of this, I can suppose that I and those I spoke with in the distant yesterday and today are a clot of invisible changes in thinking that have happened to them, and so are completely different people. A multitude of dead personalities, destroyed somewhere in the depths of the one that was forced to adapt to the mechanisms of the everyday."
        - "But what they reproduced at a specific moment of their life is a finished thought, not yet altered by transience."
        - "I set myself the goal of finding a trigger that would let me look back and give my memory a visible structure, based on how my personal associations relate to your many-sided remark, reader."
        - "My search could not end with just a photograph or something concrete in text form."
        - "A symbiosis of word, sound and image returns me, if only slightly, to a reality that is already dead."
        - "I"
